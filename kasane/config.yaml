version: "0.1"

# プロジェクト共通の記述規約 (短く保つ。長い規約は concepts へ)
context: |
  アーティファクトは日本語で記述する。技術用語および仕様構文キーワードは英語のまま使用する。
  本プロジェクトはダイアログ UI ライブラリ (AiForms.Maui.Dialogs の Native + MAUI + KMP 対応リブランド) であり、
  公開 API の契約と利用コード例は製品知識として価値を持つため、concepts の記述対象とする。
  内部実装フローや単なるファイル一覧は、コードから再導出できる情報として concepts へ記載しない。
  skills/ は concepts とコードから派生した利用者向けドキュメント (Agent Skills) であり、知識の正本ではない
  (開発時の参照先にしない)。追従更新は docs-refresh 経由のみで、初期生成・構成の見直しは承認済み change で行う。

# 標準 lint / hook (scripts/local-path-lint.py / identity-lint.py / log-sanitize.py)
lint:
  # 全 lint 共通の除外 (リポジトリ相対パスの先頭セグメントまたは glob)
  exclude: []                  # verification/ の生ログは追跡しない (2026-09-07)。sanitize 済み抜粋 (evidence/) は検査対象
  identity:
    # 検査範囲 (先頭セグメント)。skills/ とルート README 2 枚は公開する利用者向け成果物 (docs-refresh の更新対象) のため含める。
    # ソース 5 ルートも含める — Xcode の実機ビルドが DEVELOPMENT_TEAM を xcodeproj (samples/ios・samples/kmp/iosApp・
    # maui/macios/native) へ書き戻すため。実測 (2026-09-07) で誤検出 0 件。正当な UUID 定数が入ったら allow に足す
    scope: [kasane, skills, README.md, README_ja.md, samples, ios, android, maui, kmp]
    allow: [repo.local]          # 正当な値 (名前空間 UUID・デモデータの @ドメイン 等) の列挙。repo.local は Maven のシステムプロパティ maven.repo.local の末尾 (ホスト名ではない、2026-09-08)
    disable: []                  # 無効化する検出群: device / developer / network / personal / secret
  internal-hosts: []             # 未公開サーバのホスト名 (列挙したものだけを検出)
  doc-structure:                 # 育つ文書の構造 lint (references/doc-structure.md)。hook には登録しない
    scope: [kasane/concepts, kasane/handbook, kasane/roadmaps]  # 検査範囲 (index.md / log.md / rules.md は対象外)
    item-chars: 200              # 箇条書き 1 項目の上限字数 (超えたら段落・表の行・小節へ移す)
    section-items: 10            # 1 見出し配下のトップレベル項目数の上限 (超えたら小節へ割る)
    nest-depth: 3                # 違反となるネスト段数 (3 なら 2 段まで許す)
    heading-chars: 1200          # 見出しあたり散文字数の警告閾値 (表・コード・図は数えない)
    file-chars: 10000            # 1 ファイルの散文字数の警告閾値 (分割の検討トリガー)
  comment-policy:                # ソースコメント規約の lint / hook (opt-in — この節の定義が採用宣言。規約本文は handbook/cross/comment-policy.md、配布元は ksn-init templates/)
    exclude: [skills]            # 利用者向けドキュメント置き場は規約対象外 (kasane/ .claude/ build/ .git/ は常に対象外)
    ext: []                      # 検査対象に追加する拡張子 (既定は scripts/comment-policy-lint.py 冒頭の列挙)

# ドメイン軸 (長命層を core + platform で分割。cross は予約ドメイン)
domains:
  core: "全 platform が共有するダイアログ契約 (ダイアログモデル・表示制御・styling・共通 architecture)"
  ios: "iOS 系統 (UIKit/Swift ネイティブ実装)"
  android: "Android 系統 (Kotlin ネイティブ実装)"
  maui: ".NET MAUI 系統 (バインディング・MAUI 公開 API)"
  kmp: "Kotlin Multiplatform 系統 (KMP 公開 API・expect/actual 境界)"

# 用途別スキルマッピング (全ドメイン共通。platform 固有スキルは domain-skills 側へ)
skills:
  impl: []
  ui-impl: []
  test: []
  spec-review: []
  code-review: []
  domain: []

# ドメイン別スキルオーバーレイ (用途キー解決時に共通 skills へ結合される)
domain-skills:
  ios:
    impl: [swift-ui-impl-skill]
    ui-impl: [swift-ui-impl-skill]
    code-review: [swift-ui-impl-skill]
  android:
    impl: [kotlin-impl-skill, jetpack-compose-impl-skill]
    ui-impl: [jetpack-compose-impl-skill]
    code-review: [kotlin-impl-skill]
  maui:
    impl: [csharp-impl-skill, maui-skill, maui-native-binding-skill]
    ui-impl: [maui-skill]
    test: [dotnet-test-skill]
  kmp:
    impl: [kotlin-impl-skill]
    test: [kotlin-impl-skill]
    code-review: [kotlin-impl-skill]
  # core: 契約層でコードを持たないため domain-skills の割り当てなし (phase-3 で確定)

# ワーカーの起動先 (ksn-core references/worker-dispatch.md)。host = このセッションのサブエージェント / counterpart = 相方 CLI
workers:
  impl: host
  ui-impl: host        # counterpart は未検証 (視覚照合ループに画面操作が要る)
  review: host         # impl を counterpart にする場合、host に残すと単独レビューもクロスモデルになる
  verify: host
  scout: host
  extract: host
  live: host
  advise: counterpart  # 相談役 (ksn-advise)。相方 CLI の最上位モデルに出してメインとのモデル差を効かせる

# クロスモデル・セカンドオピニオン (ksn-second-opinion / ksn-counterpart が参照)
second-opinion:
  code-review: [m, l]            # 実装レビューに相方レビューを並走させる級 (空リストで無効)
  spec-review: [m, l]            # 全 platform の土台となるライブラリのため M 級から実施
  counterpart: auto              # auto = ホストの逆 (Claude Code → codex / codex → claude)

drift:
  timestamp-threshold-days: 90   # timestamp 鮮度の閾値
  deep-rotation-count: 5         # ディープ検証のローテーション件数

distill:
  archive-media: delete          # archive 時の媒体ファイル (画像・動画) の扱い: delete (既定。trash で削除してから移動) | keep

orchestrator:
  max-review-cycles: 3           # レビュー↔修正サイクルの上限 (収束シグナルが先なら早期停止)
  parallel: false                # L 級で独立タスクグループの並列実装を許可するか

ui:
  mock-variants: 2               # ksn-propose が生成するモック案数の目安
  screenshot: |                  # スクリーンショット取得手順 (2026-08-27 実測。Sample のデモ駆動モード前提)
    Sample の撮影は、samples/ 4ルートが備える**デモ駆動モードの起動引数**で状態を作る。
    撮影のためにソースを一時改変しない (刻み間隔の延長もデモの先出しも引数で行う)。
      デモの自動再生:     キー demo に安定デモ ID を渡すと、起動直後にそのメニュー項目を
                          タップしたのと同じ状態になる (定義外の ID は無視され通常メニュー)。
      Loading の刻み間隔: キー loading-step-interval-ms に 1〜600000 のミリ秒を渡すと
                          Default / Custom Loading の進捗の刻みが延び、各段階を撮れる
                          (渡さない・受理しない値は既定の 400 ms)。
      安定デモ ID 14件・アプリ識別子 (bundle id / package / activity) の一覧は
      kasane/handbook/cross/sample-parity.md「撮影支援の起動引数」節が正。
      one-shot: 自動再生はプロセスの起動につき1回だけで、画面・Activity の再生成では
                再発火しない。撮り直すには**アプリを終了してから起動し直す** (温かい再配達は非対応)。
    iOS Simulator:
      一覧/UDID: xcrun simctl list devices available
      起動:     xcrun simctl terminate <UDID> <bundle-id> ; sleep 1 ; \
                xcrun simctl launch <UDID> <bundle-id> --demo <デモID> --loading-step-interval-ms <ms>
                (引数は --キー 値 の隣接トークンペア。引数なしの起動は従来どおり通常メニュー)
                terminate の直後に launch すると既存プロセスが前面化するだけで引数が届かない
                (自動再生が起きない・刻み間隔が既定のままに見える)。1秒以上空ける。
                kmp (iOS) はコールド起動が遅く、初回描画まで6〜9秒かかることがある。
      撮影:     xcrun simctl io <UDID> screenshot <一時パス>
                プロジェクト配下へ直接書けないため scratchpad へ撮ってから cp で証跡ディレクトリへ移す。
                間を空けずに連続で撮ると画面更新が撮影に追いつかず同じコマが続けて写る。
                進捗の段階を撮り分けるときは撮影間に待ちを入れる (刻み間隔を延ばすだけでは足りない)。
      タップ:   シミュレータ操作ツール (attach → tap/touch_path)。座標は device point (原点は左上)。
                押下点はスクリーンショットの画素から実測した描画中心を使う (bbox を測って中心を出す)。
                反応しないときは目測で点をずらすのではなく描画領域を測り直す — 過去の
                「MAUI iOS は描画中心で反応しない」記録は描画中心座標の取り違えで、当たり判定の
                不具合は非実在 (add-layout-spec verification/maui-hit-test で解明済み)。
    Android エミュレータ / 実機:
      一覧:     adb devices   (複数台つながるため以降は必ず -s <serial> を付ける)
      起動:     adb -s <serial> shell am force-stop <package> ; \
                adb -s <serial> shell am start -n <package>/<activity> \
                  --es demo <デモID> --es loading-step-interval-ms <ms>
                (数値も string extra で渡す。--ei で渡した値は読まれない)
      撮影:     adb -s <serial> exec-out screencap -p > <保存先.png>
      タップ:   adb -s <serial> shell input tap <x> <y>   (座標は物理ピクセル。wm size で確認)
      戻る:     adb -s <serial> shell input keyevent 4
      IME:      ハードウェアキーボード接続時にソフトキーボードを出すには
                adb -s <serial> shell settings put secure show_ime_with_hard_keyboard 1
                (観測後は settings delete secure show_ime_with_hard_keyboard で既定へ戻す)
    共通: 結果表示の変化で判定する経路は、直前に別の結果 (completed など) にしてから操作し、
          遷移が起きたことまで撮る。

lessons:
  promote-pain: 3                # pain (失敗) の昇格閾値 (独立した change 数)
  promote-success: 5             # success (成功) の昇格閾値
  max-rules-per-scope: 12        # scope ファイルあたりの昇格済みルール上限

evolve:
  skill-repos:                   # 所有するスキルリポジトリのパス (~・相対パス可)
    - ../Kasane                  # ksn-* ハーネス本体
    - ../KsSkills                # 汎用スキル群 (csharp-impl / kotlin-impl / swift-ui 等)
  promote-projects: 2            # スキル反映の閾値 (昇格済みプロジェクト数)
