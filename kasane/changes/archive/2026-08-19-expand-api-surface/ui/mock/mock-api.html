<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mock-api: API 表面デモ追加 (メニュー5項目 + テキスト入力ダイアログ)</title>
<style>
  :root {
    --primary: #2563EB;
    --on-primary: #FFFFFF;
    --surface: #FFFFFF;
    --surface-variant: #F3F4F6;
    --on-surface: #1F2937;
    --on-surface-muted: #6B7280;
    --scrim: rgba(0, 0, 0, 0.4);
    --divider: #E5E7EB;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { background: #E9EAEE; display: flex; gap: 32px; justify-content: center; padding: 32px; flex-wrap: wrap; }
  .phone {
    width: 320px; height: 640px; background: var(--surface); border-radius: 24px;
    border: 1px solid var(--divider); overflow: hidden; position: relative;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .phone-label { text-align: center; font-size: 12px; color: var(--on-surface-muted); margin-top: 8px; }
  .appbar { padding: 20px 16px 12px; border-bottom: 1px solid var(--divider); }
  .appbar h1 { font-size: 17px; font-weight: 600; color: var(--on-surface); }
  .menu-item {
    display: flex; justify-content: space-between; align-items: center;
    min-height: 48px; padding: 0 16px; border-bottom: 1px solid var(--divider); cursor: pointer;
  }
  .menu-item span { font-size: 15px; color: var(--on-surface); }
  .menu-item .chev { color: var(--on-surface-muted); }
  .result-area { padding: 14px 16px; }
  .result-area .caption { font-size: 12px; color: var(--on-surface-muted); margin-bottom: 4px; }
  .result-area .value { font-size: 14px; color: var(--on-surface); font-family: ui-monospace, monospace; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; }
  .dialog {
    width: 272px; background: var(--surface); border-radius: 20px;
    padding: 24px 20px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.24);
  }
  .dialog .message { font-size: 15px; color: var(--on-surface); text-align: center; margin-bottom: 16px; }
  .dialog input[type="text"] {
    width: 100%; min-height: 44px; padding: 0 12px; margin-bottom: 16px;
    border: 1px solid var(--divider); border-radius: 10px; font-size: 15px;
    background: var(--surface); color: var(--on-surface);
  }
  .dialog input[type="text"]::placeholder { color: var(--on-surface-muted); }
  .dialog .buttons { display: flex; gap: 10px; }
  .dialog .buttons button {
    flex: 1; min-height: 44px; font-size: 14px; border: none; border-radius: 10px; cursor: pointer;
  }
  .btn-cancel { background: var(--surface-variant); color: var(--on-surface); }
  .btn-ok { background: var(--primary); color: var(--on-primary); font-weight: 600; }
</style>
</head>
<body>
  <div>
    <div class="phone">
      <div class="appbar"><h1>KsDialogs Sample</h1></div>
      <div class="menu-item"><span>Basic Dialog</span><span class="chev">›</span></div>
      <div class="menu-item"><span>Layout Dialog</span><span class="chev">›</span></div>
      <div class="menu-item"><span>Declarative Dialog</span><span class="chev">›</span></div>
      <div class="menu-item"><span>Text Input Dialog</span><span class="chev">›</span></div>
      <div class="menu-item"><span>Inline Dialog</span><span class="chev">›</span></div>
      <div class="result-area">
        <div class="caption">直近の結果</div>
        <div class="value">結果: completed("こんにちは")</div>
      </div>
    </div>
    <div class="phone-label">メニュー5項目 (文字列結果の表示例)</div>
  </div>
  <div>
    <div class="phone">
      <div class="appbar"><h1>KsDialogs Sample</h1></div>
      <div class="menu-item"><span>Basic Dialog</span><span class="chev">›</span></div>
      <div class="menu-item"><span>Layout Dialog</span><span class="chev">›</span></div>
      <div class="menu-item"><span>Declarative Dialog</span><span class="chev">›</span></div>
      <div class="menu-item"><span>Text Input Dialog</span><span class="chev">›</span></div>
      <div class="menu-item"><span>Inline Dialog</span><span class="chev">›</span></div>
      <div class="scrim">
        <div class="dialog">
          <div class="message">メッセージを入力してください</div>
          <input type="text" placeholder="ここに入力" value="こんにちは">
          <div class="buttons">
            <button class="btn-cancel">キャンセル</button>
            <button class="btn-ok">OK</button>
          </div>
        </div>
      </div>
    </div>
    <div class="phone-label">Text Input Dialog (カスタム結果型デモ)</div>
  </div>
</body>
</html>
