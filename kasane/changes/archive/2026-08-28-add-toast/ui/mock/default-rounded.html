<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>add-toast mock 案B: 角丸長方形 (モダン)</title>
<style>
  body { margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; background:#e9ebee; display:flex; gap:32px; align-items:flex-start; justify-content:center; padding:24px; }
  .caption { max-width:260px; font-size:13px; color:#374151; line-height:1.7; }
  .caption h1 { font-size:15px; margin:0 0 8px; }
  .phone { width:390px; height:760px; background:#fff; border-radius:32px; box-shadow:0 8px 32px rgba(0,0,0,.18); overflow:hidden; position:relative; border:1px solid #d1d5db; }
  .appbar { height:56px; background:#2563EB; color:#fff; display:flex; align-items:center; padding:0 16px; font-size:17px; font-weight:600; }
  .list { padding:8px 0; }
  .row { padding:14px 16px; border-bottom:1px solid #E5E7EB; color:#1F2937; font-size:15px; }
  .tabbar { position:absolute; bottom:0; left:0; right:0; height:64px; background:#F9FAFB; border-top:1px solid #E5E7EB; display:flex; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; color:#6B7280; gap:2px; }
  .tab.active { color:#2563EB; }
  .tab .ic { width:22px; height:22px; border-radius:6px; background:currentColor; opacity:.85; }
  /* ===== Toast デフォルト View (案B: 角丸長方形) ===== */
  .toast {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:144px; /* タブバー64 + 契約既定オフセット80 相当 */
    max-width:84%;
    background:rgba(38,38,42,0.94);
    color:#FFFFFF;
    font-size:14px; line-height:1.5; text-align:center;
    padding:13px 20px;
    border-radius:14px;
    box-shadow:0 4px 16px rgba(0,0,0,.28);
  }
  .toast.two { bottom:210px; opacity:.96; }
</style>
</head>
<body>
  <div class="phone">
    <div class="appbar">Sample</div>
    <div class="list">
      <div class="row">Default Toast</div>
      <div class="row">Custom Toast</div>
      <div class="row">Toast Stack</div>
      <div class="row">Toast Placement</div>
      <div class="row">Toast Overlap</div>
    </div>
    <div class="toast two">Toast 2 (多重時は起動順に重なる)</div>
    <div class="toast">Hello Toast!</div>
    <div class="tabbar">
      <div class="tab active"><div class="ic"></div>Home</div>
      <div class="tab"><div class="ic"></div>Search</div>
      <div class="tab"><div class="ic"></div>Settings</div>
    </div>
  </div>
  <div class="caption">
    <h1>案B: 角丸長方形 (モダン)</h1>
    <p>控えめな角丸 14 の長方形。近年の iOS 系アプリの通知バナーに寄せたモダンな案。</p>
    <p>やや濃いめのダーク地 + 白文字 14 / 中央寄せ / 複数行折り返し可 / 最大幅 84% / 影を少し強めに。</p>
    <p>既定配置は案Aと同じ (下部中央 + オフセット 80)。</p>
  </div>
</body>
</html>
