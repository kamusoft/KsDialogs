<!-- 案B: HUD カード (角丸の半透明カードに載せる) -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Default Loading — 案B (HUD カード)</title>
<style>
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; background: #444; display: flex; gap: 32px; justify-content: center; padding: 32px; }
  .phone { width: 300px; height: 560px; border-radius: 24px; overflow: hidden; position: relative; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .app { position: absolute; inset: 0; padding: 16px; }
  .app h1 { font-size: 16px; color: #1F2937; }
  .app .row { height: 40px; border-bottom: 1px solid #E5E7EB; display: flex; align-items: center; color: #1F2937; font-size: 13px; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.40); display: flex; align-items: center; justify-content: center; }
  .hud { min-width: 130px; padding: 22px 24px; border-radius: 14px; background: rgba(20,20,20,.82); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .spinner { width: 32px; height: 32px; border: 3.5px solid rgba(255,255,255,.25); border-top-color: #FFFFFF; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: #FFFFFF; font-size: 14px; text-align: center; line-height: 1.5; white-space: pre-line; }
  .caption { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: #fff; font-size: 11px; opacity: .7; }
</style>
</head>
<body>
  <div class="phone">
    <div class="app">
      <h1>KsDialogs Sample</h1>
      <div class="row">Basic Dialog</div><div class="row">Layout Dialog</div><div class="row">Default Loading</div>
    </div>
    <div class="overlay">
      <div class="hud">
        <div class="spinner"></div>
        <div class="msg">Loading...</div>
      </div>
    </div>
    <div class="caption">状態1: メッセージのみ (進捗未報告)</div>
  </div>
  <div class="phone">
    <div class="app">
      <h1>KsDialogs Sample</h1>
      <div class="row">Basic Dialog</div><div class="row">Layout Dialog</div><div class="row">Default Loading</div>
    </div>
    <div class="overlay">
      <div class="hud">
        <div class="spinner"></div>
        <div class="msg">Loading...
45%</div>
      </div>
    </div>
    <div class="caption">状態2: 進捗報告あり (既定フォーマット: メッセージ + 改行 + %)</div>
  </div>
</body>
</html>
