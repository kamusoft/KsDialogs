# Android Native の検証 (再利用可能 workflow)
#
# JVM 単体テストを持つ全モジュールのテストを実行し、実行件数を検査する。
# テストが 1 件も実行されなくても Gradle は成功で終わるため、件数の検査までを job の
# 成否判定に含める。本体が宣言的 UI (Compose) に依存していないことを見る依存グラフ検査も
# 同じ `test` の実行に乗る。
name: verify android

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    # ランナーイメージは版指定にする。`ubuntu-latest` は指す実体が予告なく次の LTS へ
    # 移り、JDK 既定版・Android SDK 同梱内容が diff なしに入れ替わる。
    runs-on: ubuntu-24.04
    # 既定の 360 分は長すぎる。手元実測 30 秒台に対する上限として置く。
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # 依存の解決結果と wrapper ディストリビューションだけをキャッシュする。
          # ビルド出力とテスト結果 (`build/`) はキャッシュしない。復元された結果を
          # 実行済みとみなす経路を作らないため。
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/build.gradle.kts', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Show toolchain
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Prepare Android SDK location
        # ビルドが SDK の位置を必要とする。local.properties は VCS 管理外のファイルなので、
        # ランナーの SDK を指すものを実行前に置く。
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME が設定されていない (ランナーイメージに Android SDK が無い)"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties

      - name: Run unit tests
        working-directory: android
        # `test` が起動する JVM テストタスクは現構成では debug の 1 系統だけで、
        # 本体の Compose 非依存を見る `verifyNoDeclarativeUiDependency` も同じ実行に乗る。
        run: ./gradlew --no-daemon --console=plain test

      - name: Verify executed test count
        # テストが失敗した場合も件数の内訳を残すため、常に実行する。
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET

          ANDROID_ROOT = "android"
          # 結果ディレクトリ名は variant 名ではなく Gradle のタスク名になる。
          TEST_TASK = "testDebugUnitTest"

          # 期待する module の集合はビルド構成 (settings.gradle.kts の include) から導出する。
          # 存在する XML を数えるだけでは、タスクごと実行されなかった module を見逃す。
          settings_path = os.path.join(ANDROID_ROOT, "settings.gradle.kts")
          with open(settings_path, encoding="utf-8") as f:
              settings = f.read()

          # コメントを除去してから全文を走査する。行頭一致で拾う形にすると、複数行に
          # 分けて書かれた include や Groovy 記法が期待集合から静かに落ち、検査が
          # 緑のまま素通りする。行末コメント内の module 名を拾わないためでもある。
          body = re.sub(r"/\*.*?\*/", " ", settings, flags=re.DOTALL)
          body = re.sub(r"//[^\n]*", " ", body)

          modules = []
          # `include(":a", ":b")` の括弧形式と、Groovy の `include ":a"` の両方を拾う。
          for matched in re.finditer(r'\binclude\s*(?:\(([^)]*)\)|((?:\s*"[^"]*"\s*,?)+))', body):
              arguments = matched.group(1) or matched.group(2) or ""
              modules.extend(re.findall(r'"(:[^"]+)"', arguments))
          modules = sorted(set(modules))

          if not modules:
              sys.exit(f"{settings_path} から module を 1 つも導出できなかった")


          def module_dir(module):
              return os.path.join(ANDROID_ROOT, *module.lstrip(":").split(":"))


          # 期待するのは JVM テストのソースセットを持つ module だけ。テストを持たない
          # module (公開 API 形状の検証モジュール) や instrumented しか持たない module を
          # 期待集合へ入れると、常に fail して検査が用をなさない。
          expected = [m for m in modules if os.path.isdir(os.path.join(module_dir(m), "src", "test"))]
          if not expected:
              sys.exit(
                  f"{settings_path} の include ({', '.join(modules)}) から"
                  " src/test を持つ module を 1 つも導出できなかった"
              )

          print(f"::notice::期待する module: {', '.join(expected)}")

          rows = []
          failures = []
          total = 0

          for module in expected:
              result_dir = os.path.join(module_dir(module), "build", "test-results", TEST_TASK)
              xml_files = sorted(glob.glob(os.path.join(result_dir, "TEST-*.xml")))
              if not xml_files:
                  rows.append((module, "結果 XML なし", "-"))
                  failures.append(f"{module}: {result_dir} にテスト結果 XML が無い")
                  continue

              tests = 0
              failed = 0
              for xml_file in xml_files:
                  root = ET.parse(xml_file).getroot()
                  tests += int(root.get("tests", "0"))
                  failed += int(root.get("failures", "0")) + int(root.get("errors", "0"))

              rows.append((module, str(tests), str(failed)))
              total += tests
              if tests == 0:
                  failures.append(f"{module}: テストが 1 件も実行されていない")

          lines = [
              "## Android テスト実行件数",
              "",
              "| module | tests | failures |",
              "|---|---:|---:|",
          ]
          lines += [f"| {m} | {t} | {f} |" for m, t, f in rows]
          lines += [
              "",
              f"**合計: {total} 件** (JVM テストを持つ {len(expected)} module / include {len(modules)} module)",
          ]

          if failures:
              lines += ["", "### 件数検査の失敗", ""]
              lines += [f"- {message}" for message in failures]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
          print("\n".join(lines))

          if failures:
              for message in failures:
                  print(f"::error::{message}")
              sys.exit(1)
          PY
