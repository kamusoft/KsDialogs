# Kotlin Multiplatform の検証 (再利用可能 workflow)
#
# 全ターゲットのテスト (Android host / iOS Simulator) と、階層化 source set の
# metadata compile を 1 回の Gradle 起動で回す。iOS Simulator のテストには ObjC 公開面の
# 検査が含まれ、公開 API 形状の検証モジュールのコンパイルも同じ実行に乗る。
# テストが 1 件も実行されなくても Gradle は成功で終わるため、ターゲットごとの件数検査までを
# job の成否判定に含める。
name: verify kmp

on:
  workflow_call:

permissions:
  contents: read

env:
  # iOS ターゲットのコンパイル・リンクが Xcode を必要とするため、ios の検証と同じ版を選ぶ。
  KS_XCODE_VERSION: "26.5"

jobs:
  verify:
    name: verify
    runs-on: macos-26
    # 既定の 360 分は長すぎる。高コストな macOS ランナーを占有し続けないよう上限を置く
    # (手元実測 1 分弱に対し、Kotlin/Native ディストリビューションの取得を含む初回を見込む)。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          # メジャー.マイナーが一致する Xcode のうち、パッチが最も新しいものを選ぶ。
          app=$(ls -d "/Applications/Xcode_${KS_XCODE_VERSION}"*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$app" ]; then
            echo "::error::Xcode ${KS_XCODE_VERSION} がランナーイメージに存在しない"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=${app}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # 依存の解決結果と wrapper ディストリビューションだけをキャッシュする。
          # ビルド出力とテスト結果 (`build/`) はキャッシュしない。復元された結果を
          # 実行済みとみなす経路を作らないため。
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          # kmp/ のビルドは android/ を composite build として巻き込み、バージョンカタログも
          # android/ のものを共有する (cross/ADR-0004)。キーは両方のビルド定義から作る。
          key: gradle-deps-kmp-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/build.gradle.kts', 'android/settings.gradle.kts', 'kmp/gradle/wrapper/gradle-wrapper.properties', 'kmp/**/build.gradle.kts', 'kmp/settings.gradle.kts') }}
          restore-keys: |
            gradle-deps-kmp-${{ runner.os }}-

      - name: Show toolchain
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Prepare Android SDK location
        # Android ターゲットのビルドが SDK の位置を必要とする。local.properties は VCS 管理外の
        # ファイルなので、ランナーの SDK を指すものを実行前に置く。
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME が設定されていない (ランナーイメージに Android SDK が無い)"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > kmp/local.properties

      - name: Run tests and metadata compile
        working-directory: kmp
        # 1 回の Gradle 起動で、全ターゲットのテストと階層化 source set の metadata compile を回す。
        run: ./gradlew --no-daemon --console=plain allTests compileCommonMainKotlinMetadata compileIosMainKotlinMetadata

      - name: Verify executed test count
        # テストが失敗した場合も件数の内訳を残すため、常に実行する。
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          # テストを持つのは共有実装のモジュールだけ (公開 API 形状の検証モジュールは
          # コンパイルされるだけでテストを持たない)。
          KMP_MODULE = os.path.join("kmp", "ksdialogs-kmp")
          # `allTests` が集約する実行ターゲット。結果ディレクトリ名は Gradle のタスク名になる。
          # ターゲットが増えたらここへ足す (増えた分が黙って検査対象から漏れないよう明示する)。
          TARGET_TASKS = ["testAndroidHostTest", "iosSimulatorArm64Test"]

          rows = []
          failures = []
          total = 0

          for task in TARGET_TASKS:
              result_dir = os.path.join(KMP_MODULE, "build", "test-results", task)
              xml_files = sorted(glob.glob(os.path.join(result_dir, "TEST-*.xml")))
              if not xml_files:
                  rows.append((task, "結果 XML なし", "-"))
                  failures.append(f"{task}: {result_dir} にテスト結果 XML が無い")
                  continue

              tests = 0
              failed = 0
              for xml_file in xml_files:
                  root = ET.parse(xml_file).getroot()
                  tests += int(root.get("tests", "0"))
                  failed += int(root.get("failures", "0")) + int(root.get("errors", "0"))

              rows.append((task, str(tests), str(failed)))
              total += tests
              if tests == 0:
                  failures.append(f"{task}: テストが 1 件も実行されていない")

          lines = [
              "## KMP テスト実行件数",
              "",
              "| ターゲット | tests | failures |",
              "|---|---:|---:|",
          ]
          lines += [f"| {t} | {n} | {f} |" for t, n, f in rows]
          lines += ["", f"**合計: {total} 件** (期待 {len(TARGET_TASKS)} ターゲット)"]

          if failures:
              lines += ["", "### 件数検査の失敗", ""]
              lines += [f"- {message}" for message in failures]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
          print("\n".join(lines))

          if failures:
              for message in failures:
                  print(f"::error::{message}")
              sys.exit(1)
          PY
