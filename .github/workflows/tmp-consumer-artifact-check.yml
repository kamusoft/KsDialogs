# 消費者検証の artifact 経路の確認専用 (一時 workflow。確認後に削除する)
#
# 消費者検証 4 本 (verify-consumer-*.yml) の `artifact` 入力は、外部で準備した配布物を
# 参照先として受け取りフィード準備を飛ばす経路である。この workflow は、その経路だけを
# CI 上で 1 回通すために置く。
#
# 前段の package job 3 つが各形態のフィード準備コマンド (verification/<形態>/prepare-feed.sh)
# を dry-run で実行し、出力された参照先ディレクトリをそのまま artifact として upload する。
# 後段の 4 job が消費者検証を `mode: dry-run` + `artifact: <artifact 名>` で呼び出す。
# KMP の artifact は Android と同じローカル Maven リポジトリのルートで、KMP 側の発行と
# スナップショット clone の tag は消費者検証 job の中で行われる。
#
# 配信先への書き込み経路は持たない。権限は contents: read だけで、secrets は渡さない
# (Maven はローカルディレクトリへの発行、NuGet は pack のみ、SwiftPM は同期スクリプトの
# 出力のみで、push / publish / tag push を一切含まない)。
name: tmp consumer artifact check

on:
  workflow_dispatch:

permissions:
  contents: read

# 連続する起動では古い実行を打ち切る (macOS ランナーを二重に積み上げないため)。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 検証用の合成 version。verification/lib/verification-args.sh の既定値と同じ文字列を
  # 明示で渡し、artifact 側と消費者側で同じ version が流れることを確認する。
  KS_VERSION: "0.0.0-alpha.0"
  # 消費者検証 workflow と同じ Xcode を選ぶ。
  KS_XCODE_VERSION: "26.5"

jobs:
  # ---------------------------------------------------------------------------
  # package 段: 各形態の配布物を作り artifact として upload する
  # ---------------------------------------------------------------------------

  package-ios:
    name: package-ios
    # 同期スクリプト自体は Xcode を必要としないが、iOS 消費者検証と同じランナー種別で
    # スナップショットを作る。
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare feed
        id: feed
        # iOS の dry-run はスナップショットへの path 参照で、version を持たない
        # (verification/lib/verification-args.sh が iOS の既定 version を空にしている)。
        run: |
          set -euo pipefail
          reference="$(verification/ios/prepare-feed.sh \
            --mode dry-run \
            --work "${RUNNER_TEMP}/feed" | tee /dev/stderr | tail -n 1)"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"

      - name: Show artifact contents
        run: ls -la "${{ steps.feed.outputs.reference }}"

      # artifact のルートはスナップショットの中身 (Package.swift / Sources/ / Tests/ /
      # LICENSE / README.md)。download 側が末尾 `KsDialogs-SPM` のディレクトリへ展開し、
      # package identity がそのディレクトリ名から決まる。
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmp-consumer-artifact-ios
          path: ${{ steps.feed.outputs.reference }}
          if-no-files-found: error
          retention-days: 1

  package-android:
    name: package-android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK location
        # 本体の発行 (android/) が SDK の位置を必要とする。local.properties は VCS 管理外の
        # ファイルなので、ランナーの SDK を指すものを実行前に置く。
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME が設定されていない (ランナーイメージに Android SDK が無い)"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties

      - name: Prepare feed
        id: feed
        # 署名鍵を渡さないため、発行の Sign タスクは skip される。
        run: |
          set -euo pipefail
          reference="$(verification/android/prepare-feed.sh \
            --mode dry-run \
            --version "${KS_VERSION}" \
            --work "${RUNNER_TEMP}/feed" | tee /dev/stderr | tail -n 1)"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"

      - name: Show artifact contents
        run: find "${{ steps.feed.outputs.reference }}" -type f | sort

      # artifact のルートはローカル Maven リポジトリのルート (`jp/kamusoft/...` の階層)。
      # KMP の消費者検証もこの artifact を参照先として受け取る。
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmp-consumer-artifact-android
          path: ${{ steps.feed.outputs.reference }}
          if-no-files-found: error
          retention-days: 1

  package-maui:
    name: package-maui
    # iOS binding の pack が Xcode を必要とするため macOS で回す。
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          # メジャー.マイナーが一致する Xcode のうち、パッチが最も新しいものを選ぶ。
          app=$(ls -d "/Applications/Xcode_${KS_XCODE_VERSION}"*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$app" ]; then
            echo "::error::Xcode ${KS_XCODE_VERSION} がランナーイメージに存在しない"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          app=$(cd "${app}" && pwd -P)
          echo "DEVELOPER_DIR=${app}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Setup JDK
        # 本体の Android binding の pack が呼ぶ Gradle の実行 JVM になる。
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Show toolchain
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          dotnet --info
          java -version

      - name: Prepare Android SDK location
        # 本体の Android binding の pack が呼ぶ Gradle ビルドが SDK の位置を必要とする。
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME が設定されていない (ランナーイメージに Android SDK が無い)"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > maui/android/native/local.properties

      - name: Install MAUI workload
        # workload set の版は global.json の workloadVersion で固定されている。
        run: dotnet workload install maui

      - name: Prepare feed
        id: feed
        run: |
          set -euo pipefail
          reference="$(verification/maui/prepare-feed.sh \
            --mode dry-run \
            --version "${KS_VERSION}" \
            --work "${RUNNER_TEMP}/feed" | tee /dev/stderr | tail -n 1)"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"

      - name: Show artifact contents
        run: ls -la "${{ steps.feed.outputs.reference }}"

      # artifact のルートはフォルダフィードのルート (3 つの .nupkg が直下に並ぶ)。
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmp-consumer-artifact-maui
          path: ${{ steps.feed.outputs.reference }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 呼び出し段: 準備済みの artifact を渡して消費者検証を回す
  # job 名は本体 CI の status check 名 (consumer-<形態>) と衝突しないものにする
  # ---------------------------------------------------------------------------

  consumer-ios-artifact:
    name: consumer-ios-artifact
    needs: package-ios
    uses: ./.github/workflows/verify-consumer-ios.yml
    with:
      mode: dry-run
      version: "0.0.0-alpha.0"
      artifact: tmp-consumer-artifact-ios

  consumer-android-artifact:
    name: consumer-android-artifact
    needs: package-android
    uses: ./.github/workflows/verify-consumer-android.yml
    with:
      mode: dry-run
      version: "0.0.0-alpha.0"
      artifact: tmp-consumer-artifact-android

  consumer-maui-artifact:
    name: consumer-maui-artifact
    needs: package-maui
    uses: ./.github/workflows/verify-consumer-maui.yml
    with:
      mode: dry-run
      version: "0.0.0-alpha.0"
      artifact: tmp-consumer-artifact-maui

  consumer-kmp-artifact:
    name: consumer-kmp-artifact
    # KMP の参照先は Android と同じローカル Maven リポジトリのルートで、KMP 側の 5
    # publication は消費者検証 job の中で同じルートへ発行される。
    needs: package-android
    uses: ./.github/workflows/verify-consumer-kmp.yml
    with:
      mode: dry-run
      version: "0.0.0-alpha.0"
      artifact: tmp-consumer-artifact-android
