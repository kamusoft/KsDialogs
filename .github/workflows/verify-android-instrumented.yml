# Android instrumented の検証 (再利用可能 workflow)
#
# 実 View のレイアウト・実入力の注入・実ウィンドウの見えを測るテストは instrumented に
# しかなく、JVM 単体テストの実行では 1 件も走らない。Emulator 1 台で instrumented テストを
# 持つ全モジュールを実行し、module ごとの実行件数を検査する。
# 端末が無い・テストが 1 件も実行されないまま成功で終わる経路を塞ぐため、件数の検査までを
# job の成否判定に含める。
# 特定の API レベルでしか成立しない挙動のテストは自分を skip して結果 XML の skipped に
# 数えられるため、実行数は tests から skipped を引いた数で見る。
#
# この job だけは Emulator が生きている間の logcat と実行環境の素性を常に採取し、失敗時は
# IME / ウィンドウの dumpsys も取って成果物に残す。instrumented のテストは IME・ウィンドウ・
# 入力の宛先といった OS 側の状態遷移に触れており、失敗した回の状態遷移 (ImeTracker /
# InsetsController の時系列) は事後には読めないため、その回の採取物だけが判別材料になる。
# 実行機の速さで並びが変わる領域なので、手元で再現しない落ち方をここで切り分ける。
#
# 環境のタイミングでだけ揺らぐと切り分けられたテストは、CI 上でのみ skip できる。
# その判定材料として、実行引数 ksdialogsCi をこの job から渡す (テスト側の SkipOnCi)。
name: verify android instrumented

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    # ランナーイメージは版指定にする。`ubuntu-latest` は指す実体が予告なく次の LTS へ
    # 移り、JDK 既定版・Android SDK 同梱内容が diff なしに入れ替わる。
    # Emulator をハードウェア支援で動かせるのは Linux ランナー (KVM) だけ。
    runs-on: ubuntu-24.04
    # 既定の 360 分は長すぎる。Emulator の起動待ちやテストのハングでランナーを
    # 占有し続けないよう上限を置く (手元実測は 300 件弱で数分)。
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # 依存の解決結果と wrapper ディストリビューションだけをキャッシュする。
          # ビルド出力とテスト結果 (`build/`) はキャッシュしない。復元された結果を
          # 実行済みとみなす経路を作らないため。
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/build.gradle.kts', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Enable KVM
        # Emulator をハードウェア支援で動かすため、ランナーのユーザーから /dev/kvm を
        # 開けるようにする。これが無いとソフトウェア実行になり起動が現実的な時間で終わらない。
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Show toolchain
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Prepare Android SDK location
        # ビルドが SDK の位置を必要とする。local.properties は VCS 管理外のファイルなので、
        # ランナーの SDK を指すものを実行前に置く。
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME が設定されていない (ランナーイメージに Android SDK が無い)"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties

      - name: Prepare instrumented run script
        # Emulator 上でテストを回す手順を 1 本のシェルスクリプトとして書き出す。
        # emulator-runner の `script` は行ごとに別々の `sh -c` へ渡されるため、背景で
        # 始めた logcat の PID や gradle の終了コードを次の行へ持ち越せない。採取と
        # 実行と後始末を 1 プロセスで完結させるには、単一のスクリプトを呼ぶ形にする。
        run: |
          set -euo pipefail
          # 観測の採取物 (logcat・dumpsys・環境の素性) の置き場。スクリプトと upload の
          # 両方が同じ場所を指す必要があるため、ここで 1 回だけ定義して以降の step に引き継ぐ
          # (job 単位の env: では runner コンテキストを参照できない)。
          KS_OBSERVATION_DIR="${RUNNER_TEMP}/ime-observation"
          echo "KS_OBSERVATION_DIR=${KS_OBSERVATION_DIR}" >> "$GITHUB_ENV"
          mkdir -p "${KS_OBSERVATION_DIR}"
          cat > "${RUNNER_TEMP}/run-instrumented.sh" <<'SCRIPT'
          set -euo pipefail

          observation_dir="${KS_OBSERVATION_DIR}"
          mkdir -p "$observation_dir"

          # 実行環境の素性を残す。api-level: 36 の指定だけでは system image の実体
          # (build fingerprint・revision) も IME の実装も固定されず、logcat を AOSP の
          # ソースと突き合わせるときに照合対象を特定できない。
          {
            echo "## ro.build.fingerprint"
            adb shell getprop ro.build.fingerprint || echo "(取得できなかった)"
            echo "## ro.build.version.incremental"
            adb shell getprop ro.build.version.incremental || echo "(取得できなかった)"
            echo "## ro.build.version.sdk"
            adb shell getprop ro.build.version.sdk || echo "(取得できなかった)"
            echo "## ime list -s -a (有効な IME)"
            adb shell ime list -s -a || echo "(取得できなかった)"
            echo "## default_input_method"
            adb shell settings get secure default_input_method || echo "(取得できなかった)"
            echo "## emulator version (sdkmanager --list_installed)"
            # `emulator -version` はランナーに libpulse.so.0 が無いため起動段階で失敗する。
            # 版は導入済みパッケージの一覧の emulator 行から取る。
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null \
              | grep -E '^[[:space:]]*emulator[[:space:]]' \
              || echo "(sdkmanager から emulator の版を取得できなかった)"
            echo "## installed system images (sdkmanager --list_installed)"
            # 座標 (api-level / target / arch) をここに重複して書くと、上の with: を変えたときに
            # grep だけ取り残されて静かに空になる。導入済みの system-images 行を全部残す。
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null \
              | grep 'system-images;' \
              || echo "(sdkmanager から system image の revision を取得できなかった)"
          } > "$observation_dir/environment.txt" 2>&1

          # 端末側の logcat リングバッファを広げてから採取を始める。既定のままだと
          # テスト 300 件弱を流す間に、失敗の直前より前の行が押し出されて消える。
          # -G はバッファごとに掛かる。要求は狙い (失敗の直前を main / system / events に残す)
          # に絞り、実際に確保された容量を素性に追記して、後から「失敗の窓が押し出されて
          # いないか」を判定できるようにする (-G が拒否された回と巻き戻った回を区別する)。
          adb logcat -b main,system,events -G 64M || echo "logcat バッファの拡大に失敗した (既定サイズのまま採取する)"
          {
            echo "## logcat -b all -g (採取時のリング容量)"
            adb logcat -b all -g || echo "(取得できなかった)"
          } >> "$observation_dir/environment.txt" 2>&1
          adb logcat -b all -c || echo "logcat バッファの消去に失敗した"

          # タグのフィルタは掛けず、バッファも既定 (main,system,crash) に限定しない。
          # 判別に要るのは ImeTracker / InsetsController / InputMethodManager(Service) /
          # WindowManager と IME プロセスの行で、タグを絞ると交差してくる別プロセス起源の
          # 要求が落ちる。入力方式まわりのイベントログは events バッファに出るので -b all
          # で読む。-v threadtime は pid/tid を出すので、IME プロセスと Activity プロセスの
          # 行を区別できる。
          adb logcat -b all -v threadtime > "$observation_dir/logcat.txt" 2>&1 &
          logcat_pid=$!

          # 採取経路が端まで通っていることを gradle の前に確かめる。adb が即座に落ちていても
          # テストは通常どおり走って成否を返すので、空振りに気づくのが成果物を開いた後
          # (Emulator 1 台 × 最大 30 分を使い切った後) になる。ここで落として無駄を省く。
          # 「一定時間で非空」の判定は端末が静かな窓に当たると偽陽性になるため、
          # 端末側に印を打ってそれが届くのを待つ形にする。
          probe_tag="KsDialogsCiLogcatProbe"
          adb shell log -p i -t "$probe_tag" "logcat capture started" || true
          probe_deadline=$((SECONDS + 15))
          probe_seen=0
          while [ "$SECONDS" -lt "$probe_deadline" ]; do
            if ! kill -0 "$logcat_pid" 2>/dev/null; then
              echo "::error::logcat の採取プロセスが落ちた (adb の障害)"
              cat "$observation_dir/logcat.txt" 2>/dev/null || true
              exit 1
            fi
            if grep -q "$probe_tag" "$observation_dir/logcat.txt" 2>/dev/null; then
              probe_seen=1
              break
            fi
            sleep 1
          done
          if [ "$probe_seen" -ne 1 ]; then
            echo "::error::端末に打った印が 15 秒以内に logcat の採取ファイルへ届かない (採取経路が通っていない)"
            cat "$observation_dir/logcat.txt" 2>/dev/null || true
            exit 1
          fi

          # 環境のタイミングでだけ揺らぐと切り分けられたテスト (SkipOnCi) を skip させる印。
          # 汎用の CI 環境変数ではなくこの引数で判定させることで、手元では skip されない。
          status=0
          ./gradlew --no-daemon --console=plain connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.ksdialogsCi=true || status=$?

          # 失敗した回だけ、Emulator が生きているうちに IME とウィンドウの状態を残す。
          # これは suite 全件が終わった後の最終状態であり、失敗の瞬間の状態ではない
          # (失敗の後も残りのテストが走り、Activity は破棄・再生成される)。失敗の瞬間は
          # logcat の時系列 (ImeTracker / InsetsController) から読み、dumpsys は補助に使う。
          # 採取の失敗でテストの結果を塗り替えないよう、ここでは終了コードを拾わない。
          if [ "$status" -ne 0 ]; then
            adb shell dumpsys input_method > "$observation_dir/dumpsys-input-method.txt" 2>&1 || true
            adb shell dumpsys window > "$observation_dir/dumpsys-window.txt" 2>&1 || true
          fi

          kill "$logcat_pid" 2>/dev/null || true
          wait "$logcat_pid" 2>/dev/null || true

          # gradle の終了コードで終える (採取のために握り潰さない)。
          exit "$status"
          SCRIPT

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API レベルは固定境界。上げるときはこの値を変える PR として意図的に行う。
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          working-directory: android
          script: bash "${RUNNER_TEMP}/run-instrumented.sh"

      - name: Upload IME observation artifacts
        # テストが失敗した回の判別材料になるのは、その回に採取した logcat と dumpsys
        # だけなので、成否によらず残す。
        # 準備 step より前で落ちた回は置き場が未定義で、空の path が別の理由で赤くなるので除く。
        if: always() && env.KS_OBSERVATION_DIR != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumented-ime-observation
          path: ${{ env.KS_OBSERVATION_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumented-test-results
          path: android/**/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify executed test count
        # テストが失敗した場合も件数の内訳を残すため、常に実行する。
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET

          ANDROID_ROOT = "android"

          # 期待する module の集合はビルド構成 (settings.gradle.kts の include) から導出する。
          # 存在する XML を数えるだけでは、タスクごと実行されなかった module を見逃す。
          settings_path = os.path.join(ANDROID_ROOT, "settings.gradle.kts")
          with open(settings_path, encoding="utf-8") as f:
              settings = f.read()

          # コメントを除去してから全文を走査する。行頭一致で拾う形にすると、複数行に
          # 分けて書かれた include や Groovy 記法が期待集合から静かに落ち、検査が
          # 緑のまま素通りする。行末コメント内の module 名を拾わないためでもある。
          body = re.sub(r"/\*.*?\*/", " ", settings, flags=re.DOTALL)
          body = re.sub(r"//[^\n]*", " ", body)

          modules = []
          # `include(":a", ":b")` の括弧形式と、Groovy の `include ":a"` の両方を拾う。
          for matched in re.finditer(r'\binclude\s*(?:\(([^)]*)\)|((?:\s*"[^"]*"\s*,?)+))', body):
              arguments = matched.group(1) or matched.group(2) or ""
              modules.extend(re.findall(r'"(:[^"]+)"', arguments))
          modules = sorted(set(modules))

          if not modules:
              sys.exit(f"{settings_path} から module を 1 つも導出できなかった")


          def module_dir(module):
              return os.path.join(ANDROID_ROOT, *module.lstrip(":").split(":"))


          # 期待するのは instrumented テストのソースセットを持つ module だけ。
          expected = [
              m for m in modules
              if os.path.isdir(os.path.join(module_dir(m), "src", "androidTest"))
          ]
          if not expected:
              sys.exit(
                  f"{settings_path} の include ({', '.join(modules)}) から"
                  " src/androidTest を持つ module を 1 つも導出できなかった"
              )

          print(f"::notice::期待する module: {', '.join(expected)}")

          rows = []
          failures = []
          total_executed = 0

          for module in expected:
              # 結果は variant と端末ごとのディレクトリに分かれて出るため、再帰で拾う。
              result_root = os.path.join(
                  module_dir(module), "build", "outputs", "androidTest-results", "connected"
              )
              xml_files = sorted(
                  glob.glob(os.path.join(result_root, "**", "TEST-*.xml"), recursive=True)
              )
              if not xml_files:
                  rows.append((module, "結果 XML なし", "-", "-", "-"))
                  failures.append(f"{module}: {result_root} にテスト結果 XML が無い")
                  continue

              tests = 0
              skipped = 0
              failed = 0
              for xml_file in xml_files:
                  root = ET.parse(xml_file).getroot()
                  tests += int(root.get("tests", "0"))
                  skipped += int(root.get("skipped", "0"))
                  failed += int(root.get("failures", "0")) + int(root.get("errors", "0"))

              executed = tests - skipped
              rows.append((module, str(tests), str(skipped), str(failed), str(executed)))
              total_executed += executed
              if executed <= 0:
                  failures.append(
                      f"{module}: instrumented テストの実行数 (tests - skipped) が 0"
                      f" (tests {tests} / skipped {skipped})"
                  )

          lines = [
              "## Android instrumented テスト実行件数",
              "",
              "| module | tests | skipped | failures | 実行数 |",
              "|---|---:|---:|---:|---:|",
          ]
          lines += [f"| {m} | {t} | {s} | {f} | {e} |" for m, t, s, f, e in rows]
          lines += ["", f"**実行数の合計: {total_executed} 件** (期待 {len(expected)} module)"]

          if failures:
              lines += ["", "### 件数検査の失敗", ""]
              lines += [f"- {message}" for message in failures]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
          print("\n".join(lines))

          if failures:
              for message in failures:
                  print(f"::error::{message}")
              sys.exit(1)
          PY
