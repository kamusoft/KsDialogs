# Kotlin Multiplatform 消費者検証 (再利用可能 workflow)
#
# 配布物を利用者と同じ経路 (公開座標 1 行の依存と、発行 metadata から再生成される Swift の
# 合成 package) で解決し、利用者向けドキュメントの KMP 最小例を含む消費者を 3 段
# (Android アプリの release / 共有モジュールの iOS framework のリンク / iOS アプリの
# Release ビルド) で通す。本体のテストは verify-kmp.yml の担当で、この workflow は
# 配布物の解決可否だけを見る。
#
# 参照先は mode で決まる。dry-run は作業ディレクトリ内のローカル Maven リポジトリと、
# 同じく作業ディレクトリ内に作る配信リポジトリのスナップショット clone への file:// 参照。
# smoke は Maven Central と配信リポジトリの tag。artifact 入力は dry-run 専用で、本体の
# Android ライブラリの発行物として扱い、その発行だけを飛ばす (KMP の発行とスナップショット
# clone の tag は job 内で行う — 合成 Swift 参照は clone の file:// を指す必要がある)。
# smoke の参照先は公開レジストリで、準備済みの配布物を差し込む余地がないため、
# 同時指定は入力検査で拒む。
#
# 配信先への書き込み経路を持たないことを構成で示すため、権限は contents: read だけとし、
# secrets は受け取らない。
name: verify consumer kmp

on:
  workflow_call:
    inputs:
      mode:
        description: "参照先の選択 (dry-run | smoke)"
        type: string
        required: true
      version:
        description: "解決する version (smoke では必須。dry-run で空なら検証用の既定値)"
        type: string
        required: false
        default: ""
      artifact:
        description: "外部で準備した配布物の artifact 名 (dry-run 専用。空ならフィード準備を job 内で行う)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # iOS ターゲットのコンパイル・リンクと消費者アプリのビルドが Xcode を必要とするため、
  # ios の検証と同じ版を選ぶ。
  KS_XCODE_VERSION: "26.5"

jobs:
  verify:
    name: verify
    runs-on: macos-26
    # 既定の 360 分は長すぎる。本体 2 ビルドの発行と 3 段のビルドに対する上限として置き、
    # ハングで高コストな macOS ランナーを占有し続けないようにする。
    timeout-minutes: 30

    steps:
      # 入力の検査はフィード準備より前に行う。checkout より前に置くことで、
      # 不正な入力が配布物の準備どころかソースの取得にも到達しない。
      - name: Validate inputs
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_VERSION: ${{ inputs.version }}
          KS_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          case "${KS_MODE}" in
            dry-run|smoke) ;;
            *)
              echo "::error::mode は dry-run か smoke のいずれかです: ${KS_MODE}"
              exit 1
              ;;
          esac
          if [ "${KS_MODE}" = "smoke" ] && [ -z "${KS_VERSION}" ]; then
            echo "::error::smoke では version が必須です"
            exit 1
          fi
          # download-artifact より前に落とす。smoke の参照先は公開レジストリで、
          # 渡された成果物は使われない — 黙って無視すると「渡した配布物を検証した」と
          # 誤解される。
          if [ "${KS_MODE}" = "smoke" ] && [ -n "${KS_ARTIFACT}" ]; then
            echo "::error::smoke では artifact を指定できません (参照先は公開レジストリで、準備済みの配布物は使いません)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          # メジャー.マイナーが一致する Xcode のうち、パッチが最も新しいものを選ぶ。
          app=$(ls -d "/Applications/Xcode_${KS_XCODE_VERSION}"*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$app" ]; then
            echo "::error::Xcode ${KS_XCODE_VERSION} がランナーイメージに存在しない"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          # ランナーイメージの Xcode_<版>.app はシンボリックリンクのことがある。消費者アプリの
          # iOS Release ビルドは xcrun 経由で native ツールを探し、その際 xcodebuild が
          # DEVELOPER_DIR 配下の SDK を絶対パスで解決する。リンク経由のパスだと
          # 「SDK cannot be located」で落ちるため、実体パスに解決してから渡す
          # (ライブラリのビルドだけを行う本体の検証はこの経路を踏まない)。
          app=$(cd "${app}" && pwd -P)
          echo "DEVELOPER_DIR=${app}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # 依存の解決結果と wrapper ディストリビューションだけをキャッシュする。
          # ビルド出力はキャッシュしない。復元された結果を実行済みとみなす経路を
          # 作らないため。フィード (参照先) は作業ディレクトリ内に実行ごとに作り直され、
          # キャッシュの対象に入らない — 前回実行の発行物が残ると、フィード準備が
          # 失敗しても解決できてしまう。
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          # 消費者は本体のバージョンカタログ (android/) を共有し、フィード準備は
          # android/ と kmp/ の両方を発行する。キーは 3 つのビルド定義から作る。
          key: gradle-consumer-kmp-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/build.gradle.kts', 'android/settings.gradle.kts', 'kmp/gradle/wrapper/gradle-wrapper.properties', 'kmp/**/build.gradle.kts', 'kmp/settings.gradle.kts', 'verification/kmp/**/build.gradle.kts', 'verification/kmp/settings.gradle.kts', 'verification/kmp/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-consumer-kmp-${{ runner.os }}-

      - name: Show toolchain
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Prepare Android SDK location
        # 本体の発行 (android/ と kmp/) が SDK の位置を必要とする。local.properties は
        # VCS 管理外のファイルなので、ランナーの SDK を指すものを実行前に置く。消費者側
        # (verification/kmp/) には置かない — 消費者スクリプトが本体 build root の設定から
        # ANDROID_HOME を解決する。
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME が設定されていない (ランナーイメージに Android SDK が無い)"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > android/local.properties
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > kmp/local.properties

      - name: Download prepared distribution
        if: inputs.artifact != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/reference

      - name: Verify consumer
        env:
          KS_MODE: ${{ inputs.mode }}
          KS_VERSION: ${{ inputs.version }}
          KS_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          args=(--mode "${KS_MODE}" --work "${RUNNER_TEMP}/consumer")
          if [ -n "${KS_VERSION}" ]; then
            args+=(--version "${KS_VERSION}")
          fi
          if [ -n "${KS_ARTIFACT}" ]; then
            args+=(--reference "${RUNNER_TEMP}/reference")
          fi
          verification/kmp/build-consumer.sh "${args[@]}"
