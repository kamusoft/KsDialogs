# android/ と kmp/ の2つの Gradle ビルドが共有するバージョンカタログ (cross/ADR-0004)。
# kmp/ の settings.gradle.kts はこのファイルを直接指して読み込む。
[versions]
# 技術セットは cross/ADR-0002 に従う
agp = "9.3.0"
kotlin = "2.4.10"
# 最低対象 OS は Android 7.0 (API 24) (cross/ADR-0002)
android-minSdk = "24"
android-compileSdk = "36"
# Android Native ライブラリ (jp.kamusoft:ksdialogs-core / jp.kamusoft:ksdialogs) の
# 開発用の既定バージョン。android/ 側の version 宣言と kmp/ 側の依存宣言が同じ値を指すよう、
# ここを唯一の情報源とする。リリース時は CI が `-Pversion=` で注入した値が優先され、
# この値は注入が無いときだけ使われる (ルート build.gradle.kts の導出式)。
# -SNAPSHOT を末尾に持つあいだ Maven Central へ向かう発行タスクは失敗する
ksdialogs = "0.1.0-SNAPSHOT"
kotlinx-coroutines = "1.11.0"
junit = "5.14.0"
# instrumented test (実機・エミュレータ上で実 View を測る検証) 用。JUnit 4 系で動く
junit4 = "4.13.2"
androidx-test-core = "1.6.1"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"
# 公開 API の色引数へ @ColorInt を付けるためだけの依存。lint 注釈のみでランタイム実体を持たない
androidx-annotation = "1.9.1"
# 宣言的 UI (Jetpack Compose) 用。取り込むのは jp.kamusoft:ksdialogs とその利用側だけで、
# 本体 jp.kamusoft:ksdialogs-core の依存グラフには入らない
androidx-compose = "1.8.1"
# Compose のホストが必要とする owner 2種 (LifecycleOwner / SavedStateRegistryOwner) の実体
androidx-lifecycle = "2.8.7"
androidx-savedstate = "1.2.1"
# Sample が戻る操作を予測型戻りジェスチャーの受け口 (OnBackPressedDispatcher) で受けるための依存。
# 本体 jp.kamusoft:ksdialogs-core の依存グラフには入らない。
# androidx-lifecycle / androidx-savedstate の宣言値より新しい版を要求しないものを選ぶ
androidx-activity = "1.10.1"
# Maven 発行プラグイン (vanniktech)。Sonatype Central Portal への発行・署名・
# sources jar / javadoc jar の生成を担う
maven-publish = "0.37.0"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "androidx-compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
androidx-compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout", version.ref = "androidx-compose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-savedstate = { module = "androidx.savedstate:savedstate", version.ref = "androidx-savedstate" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
# 宣言的 UI (Jetpack Compose) を書くモジュールに適用する Kotlin コンパイラプラグイン
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# AGP 9 以降、KMP モジュールの Android ターゲットは com.android.library ではなくこのプラグインで構成する
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# Maven Central へ発行するモジュールにだけ適用する。共通の発行設定はルート build.gradle.kts が持つ
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
